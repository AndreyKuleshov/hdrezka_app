name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # нужно для публикации релиза по тегу

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Android SDK уже установлен на раннере (ANDROID_HOME), local.properties не нужен
      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}"
          mv app/build/outputs/apk/release/app-release.apk "FoxTV-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FoxTV-apk
          path: FoxTV-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FoxTV-*.apk
          generate_release_notes: true
